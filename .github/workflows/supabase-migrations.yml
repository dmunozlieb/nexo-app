name: Supabase migrations

# Aplica las migraciones de supabase/migrations/ contra la base de datos remota
# cada vez que se hace push a main y han cambiado las migraciones. Es
# independiente del deploy de Netlify (Netlify solo compila el frontend web).
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Permite lanzarlo a mano desde la pestana Actions.
  workflow_dispatch: {}

# No aplicar migraciones en paralelo si llegan varios push seguidos.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migraciones pendientes
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          # Connection string (URI) de Supabase:
          # Project Settings -> Database -> Connection string -> URI, con la
          # contrasena de la BD incrustada. Guardar como secret del repo.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
